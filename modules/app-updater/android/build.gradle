plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appupdater'
version = '1.0.0'

android {
  namespace 'expo.modules.appupdater'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

// AndroidX Core (FileProvider, PackageInfoCompat) is exported by expo-modules-core.
