plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.systemnotifications'
version = '1.0.0'

android {
  namespace 'expo.modules.systemnotifications'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

