version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Routine bumps travel together so one PR carries the minor and patch
    # updates. The exceptions below are the SDK-locked packages: Expo pins
    # almost everything to the SDK, so they only move during a coordinated
    # SDK upgrade with `npx expo install --fix`.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # In this stack a major version of any package means a new Expo SDK.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo pins the React stack exactly, per SDK. These only move during a
      # coordinated SDK upgrade (`npx expo install --fix`), never as a
      # Dependabot PR: react-native minors break the typecheck on their own
      # (see PR #6) and react/React Native must ship matching versions.
      - dependency-name: react
      - dependency-name: "@types/react"
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      # Expo-published packages track the SDK release train too. Patch
      # releases still flow; minor releases wait for the SDK.
      - dependency-name: expo
        update-types: ["version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
