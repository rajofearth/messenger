name: Release

# A version bump plus a tag is the whole release process. The tag must match
# `expo.version` in app.json, so the APK, the tag and the changelog can never
# drift apart. The workflow can also be started by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release. Defaults to v<version in app.json>.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep these in step with the machine notes in README.md.
  EXPO_VERSION: "57.0.30"
  NODE_VERSION: 24
  JAVA_VERSION: 17
  NDK_VERSION: 27.1.12297006
  BUILD_TOOLS_VERSION: 36.0.0
  PLATFORM_VERSION: android-36
  # Baked into the JavaScript bundle at build time. Set this repository
  # variable to the Convex site URL once the update backend exists; an empty
  # value ships the app with the updater visibly unconfigured.
  EXPO_PUBLIC_UPDATE_FEED_URL: ${{ vars.EXPO_PUBLIC_UPDATE_FEED_URL }}

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The release notes print the recent commit list, which needs more
          # than the default single-commit shallow clone.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The release tag is the single source of truth: it has to match the
      # version the app reports, otherwise the APK filename would lie.
      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./app.json').expo.version")
          tag="${INPUT_TAG:-v$version}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match app.json version $version. Bump the version or use tag v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      # android/ is generated and gitignored, so every release starts from the
      # Expo config. This also means the build always matches app.json.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Install missing Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          missing=()
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || missing+=("ndk;$NDK_VERSION")
          [ -d "$ANDROID_HOME/platforms/$PLATFORM_VERSION" ] || missing+=("platforms;$PLATFORM_VERSION")
          [ -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" ] || missing+=("build-tools;$BUILD_TOOLS_VERSION")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All required SDK packages are already installed."
            exit 0
          fi
          echo "Installing: ${missing[*]}"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "${missing[@]}"

      # Restores the Gradle User Home cache written by the warm-up job in
      # ci.yml: dependencies, compiled build scripts, transformed jars and the
      # local build cache that org.gradle.caching=true fills. GitHub scopes a
      # cache to the ref that wrote it and tags are never reused, so a tag can
      # only read the default branch's entries; the warm-up job exists to keep
      # those fresh. This runs after prebuild because setup-gradle also
      # validates android/gradle/wrapper against the Gradle checksums, and the
      # wrapper only exists once the project is generated.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # A tag can never read back an entry it wrote, so it must not write
          # one; a manual dispatch from a branch may write like the warm-up
          # job does.
          cache-read-only: ${{ github.ref_type == 'tag' }}

      # Release signing is optional. With the four ANDROID_* secrets set, the
      # APK is signed with that key; without them it falls back to the debug
      # keystore that Expo generates, which is fine for a prototype and is
      # stated in the release notes.
      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(-PreactNativeArchitectures=arm64-v8a --console=plain --max-workers 4)
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            args+=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore"
              "-Pandroid.injected.signing.store.password=$STORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
            echo "RELEASE_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "RELEASE_SIGNING=0" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so the APK will be signed with the generated debug key."
          fi
          # The module's own tests run on the release variant, which shares its
          # compilation with :app:assembleRelease; a debug-variant test would
          # compile the whole debug dependency graph (expo-modules-core and
          # every Expo module) for nothing. Both variants run the same JVM
          # tests.
          ./gradlew :keyboard-media:testReleaseUnitTest :app:assembleRelease "${args[@]}"

      - name: Inspect the APK signature
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | head -6
          unzip -l "$apk" | grep -c '^.*lib/arm64-v8a/.*\.so$' | xargs -I {} echo "Packaged arm64-v8a libraries: {}"
          unzip -l "$apk" | grep -q 'assets/index.android.bundle' && echo "JavaScript bundle: present"

      # The slim-build gate from AGENTS.md, run on the real CI APK before
      # anything is published. It fails the release when the APK is over the
      # size budget or drifted away from the slim configuration.
      - name: Run the slim-build gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          args=(android/app/build/outputs/apk/release/app-release.apk)
          previous=$(gh release list --exclude-drafts --limit 20 --json tagName --jq "[.[] | select(.tagName != \"$TAG\")][0].tagName // empty" || true)
          if [ -n "${previous:-}" ]; then
            baseline=$(gh release view "$previous" --json assets --jq '[.assets[] | select(.name | endswith(".apk"))][0].size // empty' || true)
            if [ -n "${baseline:-}" ]; then
              echo "Comparing against $previous ($baseline bytes)"
              args+=(--baseline "$baseline" --baseline-label "$previous")
            fi
            # Android refuses to install a build whose versionCode is not
            # higher than the installed one, so read the real previous APK.
            mkdir -p "$RUNNER_TEMP/previous"
            if gh release download "$previous" --pattern "*.apk" --dir "$RUNNER_TEMP/previous" --clobber; then
              previous_apk=$(find "$RUNNER_TEMP/previous" -name "*.apk" -print -quit)
              if [ -n "$previous_apk" ]; then
                aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
                previous_code=$("$aapt2" dump badging "$previous_apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
                if [ -n "$previous_code" ]; then
                  args+=(--baseline-version-code "$previous_code")
                else
                  echo "::warning::Could not read the versionCode from $previous; the regression check was skipped."
                fi
              fi
            else
              echo "::warning::Could not download the APK from $previous; the versionCode regression check was skipped."
            fi
          fi
          node scripts/release-check.mjs "${args[@]}"

      - name: Collect release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          apk="artifacts/release/messenger-$VERSION-arm64-v8a.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          size=$(du -h "$apk" | cut -f1)
          echo "APK size: $size"
          (cd artifacts/release && sha256sum "messenger-$VERSION-arm64-v8a.apk" > SHA256SUMS.txt)
          cat artifacts/release/SHA256SUMS.txt
          {
            echo "## Messenger $VERSION for Android"
            echo
            echo "Standalone arm64-v8a APK built from tag \`v$VERSION\` on GitHub Actions."
            echo
            echo "### Install"
            echo
            echo "1. Download \`messenger-$VERSION-arm64-v8a.apk\` below."
            echo "2. Allow installing unknown apps for your browser or file manager."
            echo "3. Open the file and install. Android 7.0 or newer, arm64 device required."
            echo
            echo "### Contents"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- ABI: \`arm64-v8a\`"
            echo "- APK size: $size"
            echo "- Checksum: see \`SHA256SUMS.txt\`"
            if [ "${RELEASE_SIGNING:-0}" = "1" ]; then
              echo "- Signing: the project release keystore"
            else
              echo "- Signing: Expo's generated debug keystore. Not a store upload; see SECURITY.md."
            fi
            echo
            echo "This is a local prototype with no backend and no push notifications. Everything it shows is driven by the app itself."
            echo
            echo "### Commits"
            echo
            git log --oneline --no-decorate -25
          } > artifacts/release/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "artifacts/release/messenger-$VERSION-arm64-v8a.apk"
            "artifacts/release/SHA256SUMS.txt"
          )
          # Re-running a tag, or tagging a version whose release already exists
          # by hand, should replace the assets instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Messenger $VERSION" \
              --notes-file artifacts/release/notes.md
          fi

      # The feed is one small JSON document on Convex; the APK itself stays on
      # the GitHub release that was just published, so the manifest points at a
      # URL that provably exists. Without a deploy key the app simply ships
      # unconfigured; that is a warning, not a failed release.
      - name: Publish the update feed
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CONVEX_DEPLOY_KEY:-}" ]; then
            echo "::warning::CONVEX_DEPLOY_KEY is not set; the update feed was not published."
            exit 0
          fi
          npx convex deploy
          manifest=$(node scripts/update-manifest.mjs \
            "artifacts/release/messenger-$VERSION-arm64-v8a.apk" \
            --url "https://github.com/$REPOSITORY/releases/download/$TAG/messenger-$VERSION-arm64-v8a.apk")
          npx convex run --prod releases:publish "$manifest"

      - name: Refresh the release notes (best effort)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --notes-file artifacts/release/notes.md || true

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: messenger-${{ steps.version.outputs.version }}-arm64-v8a
          path: |
            artifacts/release/messenger-*.apk
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
