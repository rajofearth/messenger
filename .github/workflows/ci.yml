name: CI

# Fast checks only: the JavaScript side must be green before a release is built.
# The Android build is intentionally not part of CI (see .github/workflows/release.yml)
# because a hosted runner needs roughly half an hour for a release APK.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The tests use node --test with built-in TypeScript stripping, so they
      # need Node 22.18+ or Node 24. No device or emulator is involved.
      - name: Unit tests
        run: npm test

      # Informational: Expo publishes patches faster than this repo updates
      # dependencies, and a drifted version should not fail a pull request.
      - name: Expo dependency compatibility
        run: npx expo install --check
        continue-on-error: true

  bundle:
    name: Export the JavaScript bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches Metro-only failures (a bad asset path, an unparsable import
      # that TypeScript tolerates) without paying for a native build.
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir artifacts/ci-bundle --max-workers 2
